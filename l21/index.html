<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="基于 WebRTC 的实时多人协作乐谱编辑平台，支持 ABC 记谱法、MIDI 实时预览、版本历史管理" />
    <meta name="keywords" content="乐谱编辑, WebRTC, 协作编辑, ABC记谱法, MIDI, 音乐创作" />
    <meta name="author" content="协同乐谱编辑器" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta property="og:title" content="协同乐谱编辑器" />
    <meta property="og:description" content="实时多人协作乐谱编辑平台" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <title>协同乐谱编辑器 - WebRTC 实时协作平台</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
