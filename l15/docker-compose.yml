version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:2.13.0-pg15
    environment:
      POSTGRES_USER: citybuilder
      POSTGRES_PASSWORD: citybuilder123
      POSTGRES_DB: citybuilder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citybuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=citybuilder
      - POSTGRES_PASSWORD=citybuilder123
      - POSTGRES_DB=citybuilder
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GRID_SIZE=200
      - TICK_INTERVAL=1s
      - GAME_MINUTES_PER_TICK=1

volumes:
  postgres_data:
  redis_data:
