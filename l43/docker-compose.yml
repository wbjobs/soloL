version: "3.8"

services:
  neo4j:
    image: neo4j:5.19-community
    container_name: legal_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - legal_network

  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    container_name: legal_milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - legal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      MILVUS_URI: http://milvus-standalone:19530
    depends_on:
      neo4j:
        condition: service_started
      milvus-standalone:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    networks:
      - legal_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: legal_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - legal_network

volumes:
  neo4j_data:
  neo4j_logs:
  milvus_data:
  upload_data:

networks:
  legal_network:
    driver: bridge
