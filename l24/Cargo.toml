[package]
name = "quantum_simulator"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.15"
num-complex = "0.4"
num-traits = "0.2"
redis = { version = "0.24", features = ["json", "tokio-comp"] }
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
